<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Divya Vani">
  
  <defs>
    <linearGradient id="fvGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fae08a"></stop>
      <stop offset="55%" stop-color="#d4a14a"></stop>
      <stop offset="100%" stop-color="#8a662f"></stop>
    </linearGradient>
    <radialGradient id="fvHub" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fdedb8"></stop>
      <stop offset="100%" stop-color="#a8773a"></stop>
    </radialGradient>
    <radialGradient id="fvEye" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#7ec8e3"></stop>
      <stop offset="100%" stop-color="#1a3d6c"></stop>
    </radialGradient>
    <path id="fvPetal" d="M 15 6 Q 13.5 3, 16 0.5 Q 18.5 3, 17 6 Z" fill="url(#fvGold)" stroke="#6a4a1f" stroke-width="0.3"></path>
    <path id="fvSpoke" d="M 16 13 Q 14 11, 14 8.5 Q 14 6, 16 5 Q 18 6, 18 8.5 Q 18 11, 16 13 Z" fill="url(#fvGold)" stroke="#6a4a1f" stroke-width="0.3"></path>
  </defs>

  <g>
    <use href="#fvPetal" transform="rotate(0 16 16)"></use>
    <use href="#fvPetal" transform="rotate(45 16 16)"></use>
    <use href="#fvPetal" transform="rotate(90 16 16)"></use>
    <use href="#fvPetal" transform="rotate(135 16 16)"></use>
    <use href="#fvPetal" transform="rotate(180 16 16)"></use>
    <use href="#fvPetal" transform="rotate(225 16 16)"></use>
    <use href="#fvPetal" transform="rotate(270 16 16)"></use>
    <use href="#fvPetal" transform="rotate(315 16 16)"></use>
  </g>

  <circle cx="16" cy="16" r="9" fill="url(#fvGold)" stroke="#6a4a1f" stroke-width="0.5"></circle>
  <circle cx="16" cy="16" r="7" fill="#fff8ec"></circle>

  <g>
    <use href="#fvSpoke" transform="rotate(0 16 16)"></use>
    <use href="#fvSpoke" transform="rotate(60 16 16)"></use>
    <use href="#fvSpoke" transform="rotate(120 16 16)"></use>
    <use href="#fvSpoke" transform="rotate(180 16 16)"></use>
    <use href="#fvSpoke" transform="rotate(240 16 16)"></use>
    <use href="#fvSpoke" transform="rotate(300 16 16)"></use>
  </g>

  <circle cx="16" cy="16" r="2.6" fill="url(#fvHub)" stroke="#6a4a1f" stroke-width="0.3"></circle>
  <circle cx="16" cy="16" r="1.3" fill="url(#fvEye)"></circle>
